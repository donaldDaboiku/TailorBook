name: Wake TailorMate API

on:
  schedule:
    # Shop hours in Nigeria (UTC+1): 08:00–19:59. GitHub may delay a run.
    # Each run uses about one Action minute. This stays inside a free private-repo allowance.
    - cron: "*/14 7-18 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health
        run: curl --fail --silent --show-error --retry 3 --retry-delay 5 --max-time 90 https://tailormate-api.onrender.com/api/health
