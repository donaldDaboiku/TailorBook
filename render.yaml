# Deploy: Render Dashboard → New → Blueprint → connect this GitHub repo.
#
# After the API is live:
# 1. Set VITE_API_URL on tailormate-web to https://YOUR-API.onrender.com (no trailing slash)
# 2. Redeploy tailormate-web
# 3. Set FRONTEND_URL on tailormate-api to https://YOUR-WEB.onrender.com
# 4. Set APP_URL on tailormate-api to https://YOUR-API.onrender.com
# 5. Generate APP_KEY locally: cd backend && php artisan key:generate --show

databases:
  - name: tailormate-db
    plan: free
    databaseName: tailormate
    user: tailormate

services:
  - type: web
    name: tailormate-api
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: APP_NAME
        value: TailorMate
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        sync: false
      - key: APP_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: LANDING_URL
        sync: false
      - key: SUPPORT_EMAIL
        value: gitsystemng@gmail.com
      - key: SUPPORT_PHONE
        value: "08100197402"
      - key: SUPPORT_WHATSAPP
        value: "08100197402"
      - key: SOCIAL_INSTAGRAM
        value: https://www.instagram.com/gitsystemng/
      - key: SOCIAL_FACEBOOK
        sync: false
      - key: SOCIAL_TIKTOK
        sync: false
      - key: SOCIAL_X
        sync: false
      - key: SANCTUM_EXPIRATION
        value: "43200"
      - key: SESSION_SECURE_COOKIE
        value: "true"
      - key: MAIL_MAILER
        sync: false
      - key: MAIL_SCHEME
        value: smtp
      - key: MAIL_HOST
        sync: false
      - key: MAIL_PORT
        value: "587"
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_FROM_ADDRESS
        sync: false
      - key: MAIL_FROM_NAME
        value: TailorMate
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: info
      - key: SESSION_DRIVER
        value: database
      - key: QUEUE_CONNECTION
        value: database
      - key: CACHE_STORE
        value: database
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        fromDatabase:
          name: tailormate-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: tailormate-db
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: tailormate-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: tailormate-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: tailormate-db
          property: password
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: PAYSTACK_PUBLIC_KEY
        sync: false
      - key: PAYSTACK_PLAN_AMOUNT
        value: "500000"
      - key: PAYSTACK_PLAN_DAYS
        value: "30"
      - key: PAYSTACK_PLAN_LABEL
        value: Monthly shop plan

  # Static sites have no compute plan — do not set `plan` here.
  - type: web
    name: tailormate-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=()
      - path: /*
        name: Strict-Transport-Security
        value: max-age=31536000; includeSubDomains
    envVars:
      - key: VITE_API_URL
        sync: false

  - type: web
    name: tailormate-landing
    runtime: static
    rootDir: TailorMate
    buildCommand: echo TailorMate
    staticPublishPath: .
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
